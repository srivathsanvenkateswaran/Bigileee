[package]
name = "kaalpanthu"
version = "0.2.0"
edition = "2021"
description = "A parody 3D football game for macOS, written in Rust"

[dependencies]
bevy = { version = "0.16", features = ["wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
